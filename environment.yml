# Conda environment for the SCN2A haplospecific ASO pipeline.
#
#   conda env create -f environment.yml     # or: mamba env create -f environment.yml
#   conda activate scn2a-aso
#
# Status: these pins have not yet been solved on a machine with channel access,
# so treat the first `env create` as part of the setup and report anything the
# solver rejects. The pipeline was developed against bcftools 1.3 / samtools 1.9
# (see README.md and the hardcoded path in scn2a_generate_asog_table.py); the
# calls it makes -- bcftools view/convert --hapsample/query -l, samtools faidx,
# plink --blocks/--r2 -- are stable across the 1.x series, so the pins below are
# current releases rather than the originals. If a run diverges from the
# published tables, pin bcftools back to 1.3 before looking anywhere else.
#
# PLINK must stay on 1.9: --blocks is a 1.9 feature and is not in PLINK 2.
name: scn2a-aso

channels:
  - conda-forge
  - bioconda

dependencies:
  # Steps 1-5: region/sample subsetting, block detection, LD, hapsample export
  - bcftools=1.19
  - htslib=1.19          # provides tabix and bgzip
  - plink=1.90b6.21      # PLINK 1.9 -- required for --blocks
  - samtools=1.19.2      # Step 7 sequence windows (samtools faidx)
  - wget                 # Step 1 download

  # Step 7: standard library only
  - python=3.11

  # Step 6: haplotype parsing, Table S1 and figures
  - r-base=4.3
  - r-data.table
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-forcats
  - r-viridis
  - r-patchwork
  - r-gridextra
  - r-rlang              # used via rlang::sym; missing from the README list
  - r-svglite            # ggsave(".svg") needs it; the R step writes .svg per block
  - r-ragg               # ggsave(".png") device for the combined A/B figures
